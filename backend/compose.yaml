name: company-intranet-dev

services:
  db:
    image: mariadb:11.8.6
    environment:
      MARIADB_DATABASE: ${DB_NAME:-company_portal}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  database:
